name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  meter:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow
      - name: Meter tests (made-up data only)
        shell: bash
        working-directory: bossbar
        # These need what stays out of git (the game's fonts, test_shots, the built ocr-helper.exe): run them locally
        run: |
          local_only=" sim_victory_open_fight.py red_level.py one_char_names.py ocr_language.py "
          failed=0
          for t in tests/*.py; do
            case "$local_only" in *" $(basename "$t") "*) echo "skipped (local only): $t"; continue;; esac
            echo "::group::$t"
            if python "$t"; then echo "ok: $t"; else echo "::error::$t failed"; failed=1; fi
            echo "::endgroup::"
          done
          exit $failed
