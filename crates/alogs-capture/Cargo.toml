[package]
name = "alogs-capture"
description = "Reading the aLogs app's shared game capture, and the game window and input helpers (port of wincapture.py)"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
alogs-pil = { path = "../alogs-pil" }
log = "0.4"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation", "Win32_System_Memory", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_Storage_Xps",
  "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Diagnostics_ToolHelp", "Win32_UI_HiDpi", "Win32_System_Threading",
] }

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Memory", "Win32_Security"] }
