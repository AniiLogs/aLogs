[package]
name = "alogs-pcstats"
description = "What the PC is doing, for the meter's load line and PC line (port of pcstats.py and core.CpuLoad)"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde_json.workspace = true
regex = "1"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"
windows-sys = { version = "0.61", features = [
  "Win32_Foundation", "Win32_System_Threading", "Win32_System_ProcessStatus", "Win32_System_SystemInformation",
  "Win32_System_Diagnostics_ToolHelp", "Win32_System_Performance", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging",
] }
