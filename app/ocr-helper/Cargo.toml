[package]
name = "ocr-helper"
version = "0.1.0"
edition = "2021"
description = "PaddleOCR text models (Latin and Korean) for player names, with Windows OCR as a fallback"

[dependencies]
tract-onnx = "0.21"

[dependencies.windows]
version = "0.62"
features = ["Media_Ocr", "Graphics_Imaging", "Storage_Streams", "Globalization", "Foundation", "Foundation_Collections", "System_UserProfile"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
