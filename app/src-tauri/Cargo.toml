[package]
name = "alogs-app"
version = "0.1.28"
edition = "2021"
description = "Desktop app for the aLogs suite: boss DPS meter, results capture and leaderboards"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "unstable", "protocol-asset"] }   # protocol-asset: the game's photos in the UI (photos.rs)   # unstable: the website view inside the window (site.rs)
tauri-plugin-updater = "2"                                         # self-update from the signed GitHub feeds (update.rs)
semver = "1"
minisign-verify = "0.3"                                            # checks a kept update again before it runs
url = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
wasapi = "0.26"                                                   # the game's own audio for audio cues (audio.rs)
rustfft = "6"
regex = "1"                                                       # scrubs private data out of "Send logs" reports
zip = { version = "2", default-features = false, features = ["deflate"] }   # "Send logs" reports
windows-sys = { version = "0.61", features = [
  "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Storage_Xps", "Win32_System_Memory",
  "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi", "Win32_Security",
  # controller blocking (hidhide.rs)
  "Win32_Devices_DeviceAndDriverInstallation", "Win32_Devices_HumanInterfaceDevice", "Win32_Devices_Properties",
  "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Registry", "Win32_System_Services",
  "Win32_System_Threading", "Win32_UI_Shell",
] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
