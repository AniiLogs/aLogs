[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.37"
edition = "2024"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip", "preserve_order"] }   # floats bit for bit; key order as Python keeps it
